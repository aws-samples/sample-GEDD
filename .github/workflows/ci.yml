name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          cd grounded-evals
          pip install -e ".[dev]"
      - run: cd grounded-evals && python -m pytest tests/ -q --tb=short
      # Lint is a gate for src/ and tests/ (line length and a few legacy rules ignored for now).
      - run: cd grounded-evals && ruff check src/ tests/ --ignore E501,E741,F401
      # Formatting is advisory until the codebase has been formatted once.
      - name: ruff format (advisory)
        continue-on-error: true
        run: cd grounded-evals && ruff format --check src/ tests/

  findings-reproduce:
    # Every number in README.md / FINDINGS.md is generated by these scripts from saved per-case results.
    # Re-run them and fail if the committed results drift (no API keys or datasets needed).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install uv
      - name: Re-run findings scripts
        working-directory: experiments/docile-invoices
        run: |
          uv sync --frozen
          uv run python -W ignore 08_rigor.py
          uv run python -W ignore 09_reward_gate_ppi.py
      - name: Fail if committed findings drift
        run: >-
          git diff --exit-code --
          experiments/docile-invoices/results/rigor.json
          experiments/docile-invoices/results/reward_gate_ppi.json

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Check for secrets
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          extra_args: --only-verified

  cdk-synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - run: npm install -g aws-cdk@2
      - run: |
          cd grounded-evals
          pip install -e ".[dev,deploy]"
          cd infra && pip install -r requirements.txt
          cdk synth --no-lookups
