version: 2
updates:
  - package-ecosystem: pip
    directory: /grounded-evals
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
  - package-ecosystem: pip
    directory: /grounded-evals/infra
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
  - package-ecosystem: pip
    directory: /grounded-evals/agentcore
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
  - package-ecosystem: uv
    directory: /docile-forge
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
  - package-ecosystem: docker
    directory: /grounded-evals
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
